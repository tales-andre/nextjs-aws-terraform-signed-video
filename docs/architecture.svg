<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Architecture on AWS: CloudFront in front of the Next.js app and the private video bucket</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .key { fill: #e8f3f4; stroke: #1f6f78; stroke-width: 2; }
      .t { font-size: 17px; font-weight: 700; fill: #14213d; }
      .s { font-size: 13px; fill: #475569; }
      .l { font-size: 12.5px; fill: #1f6f78; font-weight: 600; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#a); }
      .dash { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#f6f7fb"/>

  <!-- browser -->
  <rect class="box" x="30" y="200" width="150" height="90" rx="12"/>
  <text class="t" x="105" y="238" text-anchor="middle">Browser</text>
  <text class="s" x="105" y="260" text-anchor="middle">student or admin</text>

  <!-- cloudfront -->
  <rect class="key" x="250" y="170" width="200" height="150" rx="12"/>
  <text class="t" x="350" y="205" text-anchor="middle">CloudFront</text>
  <text class="s" x="350" y="228" text-anchor="middle">HTTPS, one domain</text>
  <text class="s" x="350" y="256" text-anchor="middle">/videos/* needs a signed</text>
  <text class="s" x="350" y="274" text-anchor="middle">URL from the key group</text>
  <text class="s" x="350" y="300" text-anchor="middle">everything else: the app</text>

  <path class="line" d="M180,245 L248,245"/>

  <!-- ALB -->
  <rect class="box" x="530" y="60" width="190" height="100" rx="12"/>
  <text class="t" x="625" y="95" text-anchor="middle">Load balancer</text>
  <text class="s" x="625" y="117" text-anchor="middle">CloudFront IP ranges only</text>
  <text class="s" x="625" y="137" text-anchor="middle">+ secret header, else 403</text>
  <path class="line" d="M450,200 C490,170 500,120 528,112"/>
  <text class="l" x="470" y="140">app pages</text>

  <!-- ECS -->
  <rect class="key" x="790" y="60" width="180" height="100" rx="12"/>
  <text class="t" x="880" y="95" text-anchor="middle">Next.js on ECS</text>
  <text class="s" x="880" y="117" text-anchor="middle">Fargate container</text>
  <text class="s" x="880" y="137" text-anchor="middle">login, roles, signer</text>
  <path class="line" d="M720,110 L788,110"/>

  <!-- S3 -->
  <rect class="box" x="530" y="330" width="190" height="100" rx="12"/>
  <text class="t" x="625" y="365" text-anchor="middle">S3 bucket (private)</text>
  <text class="s" x="625" y="387" text-anchor="middle">videos/ and meta/</text>
  <text class="s" x="625" y="407" text-anchor="middle">public access blocked</text>
  <path class="line" d="M450,290 C490,320 500,370 528,375"/>
  <text class="l" x="440" y="350">videos via OAC</text>

  <!-- SSM -->
  <rect class="box" x="790" y="230" width="180" height="90" rx="12"/>
  <text class="t" x="880" y="265" text-anchor="middle">SSM parameters</text>
  <text class="s" x="880" y="287" text-anchor="middle">signing key, passwords</text>
  <path class="dash" d="M880,228 L880,162"/>

  <path class="dash" d="M840,162 C820,250 760,330 722,370"/>
  <text class="l" x="760" y="345">upload, lesson list</text>

  <!-- CI -->
  <rect class="box" x="30" y="440" width="300" height="90" rx="12"/>
  <text class="t" x="180" y="475" text-anchor="middle">GitHub Actions (manual deploy)</text>
  <text class="s" x="180" y="497" text-anchor="middle">OIDC role, no stored AWS keys</text>
  <rect class="box" x="790" y="440" width="180" height="90" rx="12"/>
  <text class="t" x="880" y="475" text-anchor="middle">ECR</text>
  <text class="s" x="880" y="497" text-anchor="middle">container image</text>
  <path class="dash" d="M330,485 L788,485"/>
  <text class="l" x="460" y="475">push image, restart service</text>
  <path class="dash" d="M935,438 C990,330 990,200 972,140"/>

  <text class="s" x="30" y="40" font-size="14">All of it is Terraform in infra/ and is tested offline with a mocked AWS provider.</text>
</svg>
